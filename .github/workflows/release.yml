name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without a leading v. Leave empty to use the VERSION file.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish the macOS release
    # Pinned instead of macos-latest: Package.swift needs Swift 6.2 (Xcode 26), and a runner image change shouldn't
    # silently change what a release is built with.
    runs-on: macos-26

    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Resolve version and release notes
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          # The release notes are this version's section of CHANGELOG.md. Fail before building if it's missing.
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        shell: bash
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        shell: bash
        run: ./scripts/test.sh

      - name: Build artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-release.sh

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"
          title="Macster $VERSION"
          notes_file="$RUNNER_TEMP/notes.md"

          {
            echo "Keep your Mac awake with the lid closed, from the menu bar. Universal build for Apple silicon and Intel, macOS 14 or later."
            echo
            echo "## What's new"
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "## Install"
            echo
            echo "Download \`Macster-$VERSION.dmg\`, open it, and drag Macster into Applications. Macster is ad-hoc signed, not notarized: if macOS blocks the first launch, open System Settings → Privacy & Security and click **Open Anyway**."
            echo
            echo "\`checksums.txt\` has the SHA-256 checksums of the DMG and the ZIP."
          } > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes_file"
          fi

          gh release upload "$tag" \
            "dist/Macster-$VERSION.dmg" \
            "dist/Macster-$VERSION.zip" \
            dist/checksums.txt \
            --clobber
